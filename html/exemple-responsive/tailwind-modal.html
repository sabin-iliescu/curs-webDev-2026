<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal simplu - Tailwind și dialog HTML</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="p-4 font-sans leading-relaxed text-gray-800">
    <main>
      <h1 class="mb-3 text-xl font-bold">O pauză la cafenea</h1>
      <p class="mb-4">Află programul fără să pleci de pe pagină.</p>
      <button type="button" class="rounded bg-purple-700 px-4 py-2 text-white"
              onclick="document.getElementById('program').showModal()">
        Vezi programul
      </button>
    </main>
    <footer class="mt-4">
      <a class="text-purple-800 underline" href="../Responsive-Web-Design.html#modal-tailwind" target="_top">&larr; Înapoi la lecție</a>
    </footer>

    <dialog id="program" aria-labelledby="titlu-program"
            class="m-auto w-11/12 max-w-sm rounded-lg bg-white p-6 text-gray-800 backdrop:bg-black/50">
      <h2 id="titlu-program" class="mb-3 text-xl font-bold">Programul cafenelei</h2>
      <p class="mb-4">Luni-vineri: 09:00-18:00.</p>
      <button type="button" autofocus
              class="rounded bg-purple-700 px-4 py-2 text-white"
              onclick="document.getElementById('program').close()">
        Am înțeles
      </button>
    </dialog>
  </body>
</html>
