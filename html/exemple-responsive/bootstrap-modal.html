<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal simplu - Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="p-3">
    <main class="container">
      <h1 class="h5 mb-3">O pauză la cafenea</h1>
      <p>Află programul fără să pleci de pe pagină.</p>
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#program">
        Vezi programul
      </button>
    </main>
    <footer class="container mt-3">
      <a href="../Responsive-Web-Design.html#modal-bootstrap" target="_top">&larr; Înapoi la lecție</a>
    </footer>

    <div class="modal fade" id="program" tabindex="-1" aria-labelledby="titlu-program" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="titlu-program">Programul cafenelei</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Închide"></button>
          </div>
          <div class="modal-body">
            <p>Luni-vineri: 09:00-18:00.</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Am înțeles</button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
